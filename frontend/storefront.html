<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Foto da fachada</title>
<link rel="stylesheet" href="style.css" />
<style>
  .sf-wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 32px 16px;
  }
  .sf-wrap h1 {
    font-size: 1.4rem;
    margin-bottom: 16px;
  }
  .sf-form {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  .sf-form input {
    flex: 1;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 0.95rem;
  }
  .sf-form button {
    padding: 10px 16px;
    border-radius: 8px;
    border: none;
    background: #111;
    color: #fff;
    cursor: pointer;
  }
  .sf-form button:disabled {
    opacity: 0.5;
    cursor: default;
  }
  .sf-result img {
    width: 100%;
    border-radius: 12px;
    display: block;
  }
  .sf-status {
    font-size: 0.9rem;
    color: #666;
    min-height: 1.2em;
    margin-bottom: 12px;
  }
  .sf-status.error {
    color: #c0392b;
  }
  .sf-score {
    margin-top: 16px;
    padding: 14px 16px;
    border-radius: 12px;
    background: #f4f4f4;
    font-size: 0.9rem;
    line-height: 1.5;
  }
  .sf-score .sf-badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    font-weight: 600;
    font-size: 0.8rem;
    color: #fff;
    margin-right: 6px;
  }
  .sf-badge.comercial { background: #2563eb; }
  .sf-badge.residencial { background: #16a34a; }
  .sf-badge.indeterminado { background: #71717a; }
  .sf-bar {
    height: 8px;
    border-radius: 999px;
    background: #e5e5e5;
    overflow: hidden;
    margin: 8px 0;
  }
  .sf-bar-fill {
    height: 100%;
    background: #2563eb;
  }
  .sf-batch-link {
    display: inline-block;
    margin-bottom: 20px;
    font-size: 0.9rem;
    color: #2563eb;
    text-decoration: none;
  }
  .sf-batch-link:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>
  <div class="sf-wrap">
    <h1>Foto da fachada (Street View)</h1>
    <a class="sf-batch-link" href="storefront-csv.html">Prefere subir uma lista? Envie um CSV com vários endereços →</a>
    <form id="sfForm" class="sf-form">
      <input id="sfAddress" type="text" placeholder="Endereço completo do estabelecimento" required />
      <button id="sfBtn" type="submit">Buscar foto</button>
    </form>
    <p id="sfStatus" class="sf-status"></p>
    <div class="sf-result">
      <img id="sfImage" alt="" hidden />
      <div id="sfScore" class="sf-score" hidden></div>
    </div>
  </div>

  <script>
    const form = document.getElementById('sfForm');
    const input = document.getElementById('sfAddress');
    const btn = document.getElementById('sfBtn');
    const status = document.getElementById('sfStatus');
    const img = document.getElementById('sfImage');
    const scoreBox = document.getElementById('sfScore');

    function renderScore(data) {
      const classe = (data.classificacao || 'indeterminado').toLowerCase();
      const score = typeof data.score_comercial === 'number' ? data.score_comercial : null;
      const portaVisivel = data.porta_atendimento_visivel;
      const portaAberta = data.porta_aberta;

      let portaTexto = 'Nenhuma porta de atendimento identificada.';
      if (portaVisivel) {
        if (portaAberta === true) portaTexto = 'Porta de atendimento visível e ABERTA.';
        else if (portaAberta === false) portaTexto = 'Porta de atendimento visível e fechada.';
        else portaTexto = 'Porta de atendimento visível (estado indeterminado).';
      }

      scoreBox.innerHTML = `
        <span class="sf-badge ${classe}">${classe}</span>
        <span>Score comercial: ${score !== null ? score + '/100' : 'N/D'}</span>
        <div class="sf-bar"><div class="sf-bar-fill" style="width:${score ?? 0}%"></div></div>
        <div>${portaTexto}</div>
        ${data.justificativa ? `<div style="margin-top:6px;color:#555">${data.justificativa}</div>` : ''}
      `;
      scoreBox.hidden = false;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const address = input.value.trim();
      if (!address) return;

      btn.disabled = true;
      status.textContent = 'Buscando...';
      status.classList.remove('error');
      img.hidden = true;
      scoreBox.hidden = true;

      try {
        const url = '/api/storefront-image?address=' + encodeURIComponent(address);
        const resp = await fetch(url);
        if (!resp.ok) {
          const data = await resp.json().catch(() => ({}));
          throw new Error(data.detail || `Erro ${resp.status}`);
        }
        const blob = await resp.blob();
        img.src = URL.createObjectURL(blob);
        img.hidden = false;
        status.textContent = 'Analisando fachada...';

        const scoreResp = await fetch('/api/storefront-score?address=' + encodeURIComponent(address));
        const scoreData = await scoreResp.json();
        if (!scoreResp.ok) {
          throw new Error(scoreData.detail || `Erro ${scoreResp.status} ao analisar a foto.`);
        }
        renderScore(scoreData);
        status.textContent = '';
      } catch (err) {
        status.textContent = err.message || 'Falha ao buscar a imagem.';
        status.classList.add('error');
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
